<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>忘年会 景品ルーレット</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0d0a14;
        --panel: rgba(26, 20, 40, 0.88);
        --panel-border: rgba(255, 197, 66, 0.35);
        --gold: #ffc542;
        --gold-deep: #e79b12;
        --ink: #fff7e6;
        --ink-dim: #cbbfd9;
        --danger: #ff5d73;
        --ok: #3ddc84;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
        background:
          radial-gradient(1100px 700px at 50% -10%, rgba(255, 197, 66, 0.16), transparent 60%),
          radial-gradient(900px 600px at 85% 110%, rgba(255, 93, 162, 0.12), transparent 60%),
          radial-gradient(900px 600px at 10% 110%, rgba(64, 196, 255, 0.10), transparent 60%),
          var(--bg);
        color: var(--ink);
        min-height: 100dvh;
        overflow-x: hidden;
      }
      /* rotating light rays behind the stage */
      .rays {
        position: fixed; inset: -40vmax;
        background: conic-gradient(from 0deg,
          rgba(255,197,66,0.05) 0deg 10deg, transparent 10deg 20deg,
          rgba(255,197,66,0.05) 20deg 30deg, transparent 30deg 40deg,
          rgba(255,197,66,0.05) 40deg 50deg, transparent 50deg 60deg,
          rgba(255,197,66,0.05) 60deg 70deg, transparent 70deg 80deg,
          rgba(255,197,66,0.05) 80deg 90deg, transparent 90deg 100deg,
          rgba(255,197,66,0.05) 100deg 110deg, transparent 110deg 120deg,
          rgba(255,197,66,0.05) 120deg 130deg, transparent 130deg 140deg,
          rgba(255,197,66,0.05) 140deg 150deg, transparent 150deg 160deg,
          rgba(255,197,66,0.05) 160deg 170deg, transparent 170deg 180deg,
          rgba(255,197,66,0.05) 180deg 190deg, transparent 190deg 200deg,
          rgba(255,197,66,0.05) 200deg 210deg, transparent 210deg 220deg,
          rgba(255,197,66,0.05) 220deg 230deg, transparent 230deg 240deg,
          rgba(255,197,66,0.05) 240deg 250deg, transparent 250deg 260deg,
          rgba(255,197,66,0.05) 260deg 270deg, transparent 270deg 280deg,
          rgba(255,197,66,0.05) 280deg 290deg, transparent 290deg 300deg,
          rgba(255,197,66,0.05) 300deg 310deg, transparent 310deg 320deg,
          rgba(255,197,66,0.05) 320deg 330deg, transparent 330deg 340deg,
          rgba(255,197,66,0.05) 340deg 350deg, transparent 350deg 360deg);
        animation: rays-spin 90s linear infinite;
        pointer-events: none;
        z-index: 0;
      }
      @keyframes rays-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .rays { animation: none; }
      }

      .wrap { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 18px 16px 40px; }
      header { text-align: center; margin: 6px 0 4px; }
      h1 {
        margin: 0;
        font-size: clamp(1.7rem, 5.2vw, 3rem);
        font-weight: 800;
        letter-spacing: 0.04em;
        color: var(--gold);
        text-shadow: 0 0 18px rgba(255,197,66,0.55), 0 3px 0 #8a5b00, 0 6px 22px rgba(0,0,0,0.6);
      }
      .subtitle { margin: 6px 0 0; color: var(--ink-dim); font-size: clamp(0.85rem, 2.6vw, 1rem); font-weight: 700; letter-spacing: 0.14em; }

      .layout { display: grid; grid-template-columns: minmax(0, 1fr) 372px; gap: 22px; margin-top: 14px; align-items: start; }
      @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
      /* settings hidden: roulette takes the full width, history moves below */
      .layout.settings-hidden { grid-template-columns: 1fr; }
      .layout.settings-hidden .wheel-zone { width: min(88vw, 640px); }
      .layout.settings-hidden aside { width: 100%; max-width: 640px; margin: 0 auto; }
      #settingsPanel[hidden] { display: none; }

      .settings-bar { display: flex; justify-content: flex-end; margin-top: 2px; }
      .settings-toggle-btn {
        font-family: inherit; font-size: 17px; line-height: 1;
        color: var(--ink-dim); background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.09); border-radius: 50%;
        width: 38px; height: 38px; padding: 0; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center;
        opacity: 0.45;
        transition: opacity 0.15s, background 0.15s;
      }
      .settings-toggle-btn:hover, .settings-toggle-btn:focus-visible { opacity: 1; background: rgba(255,255,255,0.12); }
      .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .panel-head h2 { margin: 0 0 4px; }
      .hide-settings-btn {
        font-family: inherit; font-weight: 700; font-size: 0.8rem; white-space: nowrap;
        color: var(--ink); background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.22); border-radius: 999px;
        padding: 7px 13px; min-height: 38px; cursor: pointer; flex: none;
      }
      .hide-settings-btn:hover { background: rgba(255,255,255,0.16); }

      /* ---------- stage ---------- */
      .stage { display: flex; flex-direction: column; align-items: center; }
      .wheel-zone { position: relative; width: min(80vw, 560px); aspect-ratio: 1 / 1; }
      .wheel-zone.shake { animation: wheel-shake 0.34s ease-out; }
      @keyframes wheel-shake {
        0% { transform: translate(0,0); }
        20% { transform: translate(-5px, 3px) rotate(-0.4deg); }
        40% { transform: translate(5px, -2px) rotate(0.4deg); }
        60% { transform: translate(-3px, -3px); }
        80% { transform: translate(3px, 2px); }
        100% { transform: translate(0,0); }
      }
      svg.wheel { width: 100%; height: 100%; display: block; filter: drop-shadow(0 18px 34px rgba(0,0,0,0.65)); }
      .bulbs { position: absolute; inset: 0; pointer-events: none; }
      .bulb {
        position: absolute; width: 13px; height: 13px; border-radius: 50%;
        transform: translate(-50%, -50%);
        background: #ffe9a8;
        box-shadow: 0 0 10px 3px rgba(255, 213, 92, 0.85);
        animation: bulb-blink 0.9s steps(1) infinite;
      }
      .bulb.alt { animation-delay: 0.45s; background: #ffb3c8; box-shadow: 0 0 10px 3px rgba(255, 120, 170, 0.8); }
      @keyframes bulb-blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0.25; box-shadow: none; } }
      @media (prefers-reduced-motion: reduce) { .bulb { animation: none; } }

      /* dart — JS positions it (left/top = tip point), sizes it from the wheel
         size, and rotates it via --dart-rot so each throw can land at a
         different angle / distance while the whole dart stays inside the rim */
      .dart {
        position: absolute; left: 50%; top: 0;
        width: 84px; margin-left: -42px; margin-top: -133px;
        transform-origin: 50% 100%;
        --dart-rot: 6deg;
        transform: translate(190px, -190px) rotate(48deg);
        opacity: 0; pointer-events: none; z-index: 5;
        filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5));
      }
      .dart.fly { transition: transform 0.16s cubic-bezier(0.5, 0, 0.9, 0.4), opacity 0.05s; opacity: 1; transform: translate(0, 0) rotate(var(--dart-rot)); }
      .dart.stuck { animation: dart-wobble 0.7s ease-out; }
      @keyframes dart-wobble {
        0% { transform: translate(0,0) rotate(var(--dart-rot)); }
        25% { transform: translate(0,0) rotate(calc(var(--dart-rot) + 5deg)); }
        50% { transform: translate(0,0) rotate(calc(var(--dart-rot) - 4deg)); }
        75% { transform: translate(0,0) rotate(calc(var(--dart-rot) + 2deg)); }
        100% { transform: translate(0,0) rotate(var(--dart-rot)); }
      }

      .spin-btn {
        margin-top: 26px;
        font-family: inherit;
        font-size: clamp(1.35rem, 4.5vw, 1.9rem);
        font-weight: 800; letter-spacing: 0.12em;
        color: #3a2400;
        background: linear-gradient(180deg, #ffe082, var(--gold) 45%, var(--gold-deep));
        border: 3px solid #fff0bd;
        border-radius: 999px;
        padding: 16px 58px;
        min-height: 64px;
        cursor: pointer;
        box-shadow: 0 0 26px rgba(255,197,66,0.55), 0 10px 0 #9a6a00, 0 18px 30px rgba(0,0,0,0.55);
        transition: transform 0.08s, box-shadow 0.08s, filter 0.15s;
      }
      .spin-btn:hover:not(:disabled) { filter: brightness(1.06); }
      .spin-btn:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0 26px rgba(255,197,66,0.55), 0 4px 0 #9a6a00, 0 10px 18px rgba(0,0,0,0.55); }
      .spin-btn:disabled { filter: grayscale(0.35) brightness(0.75); cursor: wait; }
      .spin-hint { margin-top: 14px; color: var(--ink-dim); font-size: 0.9rem; font-weight: 700; min-height: 1.4em; text-align: center; }

      /* ---------- side panels ---------- */
      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 16px 16px 18px;
        margin-bottom: 18px;
        backdrop-filter: blur(4px);
      }
      .panel h2 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 800; color: var(--gold); letter-spacing: 0.06em; }
      .panel .note { margin: 0 0 12px; color: var(--ink-dim); font-size: 0.8rem; line-height: 1.5; }
      .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
      .tool-btn {
        font-family: inherit; font-weight: 700; font-size: 0.85rem;
        color: var(--ink); background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.22); border-radius: 10px;
        padding: 8px 14px; min-height: 40px; cursor: pointer;
        display: inline-flex; align-items: center; gap: 7px;
      }
      .tool-btn:hover { background: rgba(255,255,255,0.15); }
      .tool-btn svg { width: 17px; height: 17px; flex: none; }
      .tool-btn[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }

      .item-row {
        display: grid; grid-template-columns: 16px minmax(0,1fr) auto auto; gap: 9px; align-items: center;
        padding: 7px 8px; border-radius: 10px; background: rgba(255,255,255,0.045);
        margin-bottom: 7px;
      }
      .item-row.off { opacity: 0.45; }
      .dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.55); }
      .item-name {
        font-family: inherit; font-weight: 700; font-size: 0.98rem; color: var(--ink);
        background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.18); border-radius: 8px;
        padding: 8px 10px; min-height: 40px; width: 100%; min-width: 0;
      }
      .layout > *, .panel, .item-row, .weight-ctl, .row-actions { min-width: 0; }
      .item-name:focus { outline: 2px solid var(--gold); outline-offset: 0; }
      .weight-ctl { display: flex; align-items: center; gap: 4px; }
      .w-btn {
        font-family: inherit; font-weight: 800; font-size: 1rem; line-height: 1;
        width: 38px; height: 40px; border-radius: 8px; cursor: pointer;
        color: var(--ink); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.22);
      }
      .w-btn:hover { background: rgba(255,255,255,0.2); }
      .w-val { min-width: 62px; text-align: center; }
      .w-num { font-weight: 800; font-size: 1rem; }
      .w-pct { display: block; font-size: 0.68rem; color: var(--ink-dim); font-weight: 700; }
      .row-actions { display: flex; gap: 5px; }
      .mini-btn {
        font-family: inherit; font-weight: 700; font-size: 0.78rem;
        min-height: 40px; padding: 6px 10px; border-radius: 8px; cursor: pointer;
        color: var(--ink); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
        white-space: nowrap;
      }
      .mini-btn.exclude { color: #ffb3ba; border-color: rgba(255,93,115,0.5); }
      .mini-btn.restore { color: #a7f3c9; border-color: rgba(61,220,132,0.5); }
      .mini-btn.del { color: var(--ink-dim); padding: 6px 9px; }
      .add-btn {
        width: 100%; font-family: inherit; font-weight: 800; font-size: 0.95rem;
        min-height: 46px; border-radius: 10px; cursor: pointer; margin-top: 4px;
        color: var(--gold); background: rgba(255,197,66,0.1); border: 1.5px dashed rgba(255,197,66,0.6);
      }
      .add-btn:hover { background: rgba(255,197,66,0.18); }
      @media (max-width: 560px) {
        .item-row { display: flex; flex-wrap: wrap; row-gap: 8px; }
        .item-row .item-name { flex: 1 1 140px; width: auto; }
        .item-row .weight-ctl { order: 3; }
        .item-row .row-actions { order: 4; margin-left: auto; }
      }
      button:disabled, input:disabled { opacity: 0.5; cursor: not-allowed; }

      .history-list { list-style: none; margin: 0; padding: 0; }
      .history-list li {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.045); margin-bottom: 7px;
        font-weight: 700;
      }
      .history-list .round { color: var(--ink-dim); font-size: 0.8rem; min-width: 3.4em; }
      .history-list .hname { font-size: 1.05rem; }
      .history-empty { color: var(--ink-dim); font-size: 0.88rem; margin: 4px 0 0; }

      /* ---------- winner overlay ---------- */
      .overlay {
        position: fixed; inset: 0; z-index: 40;
        display: none; align-items: center; justify-content: center;
        background: rgba(5, 3, 10, 0.72); padding: 18px;
      }
      .overlay.show { display: flex; }
      .winner-card {
        text-align: center; max-width: 520px; width: 100%;
        background: radial-gradient(420px 300px at 50% 0%, rgba(255,197,66,0.22), transparent 70%), #1c1430;
        border: 2px solid var(--gold); border-radius: 20px;
        padding: 30px 24px 26px;
        box-shadow: 0 0 60px rgba(255,197,66,0.45), 0 30px 60px rgba(0,0,0,0.7);
        animation: winner-pop 0.45s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      @keyframes winner-pop { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .winner-label { font-weight: 800; letter-spacing: 0.3em; color: var(--gold); font-size: 1rem; margin: 0; }
      .winner-name {
        margin: 8px 0 4px; font-weight: 800; line-height: 1.15;
        font-size: clamp(3rem, 14vw, 5.2rem); color: #fff;
        text-shadow: 0 0 26px rgba(255,197,66,0.8), 0 4px 0 rgba(0,0,0,0.35);
        word-break: break-all;
      }
      .winner-sub { margin: 0 0 20px; color: var(--ink-dim); font-weight: 700; }
      .winner-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .winner-btns button {
        font-family: inherit; font-weight: 800; font-size: 0.98rem;
        min-height: 52px; padding: 12px 22px; border-radius: 999px; cursor: pointer;
      }
      .btn-exclude { color: #fff; background: var(--danger); border: 2px solid #ffc2ca; box-shadow: 0 6px 18px rgba(255,93,115,0.4); }
      .btn-keep { color: var(--ink); background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.35); }

      #confetti { position: fixed; inset: 0; z-index: 30; pointer-events: none; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
  </head>
  <body>
    <div class="rays" aria-hidden="true"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <div class="wrap">
      <header>
        <h1>忘年会 景品ルーレット</h1>
        <p class="subtitle">BOUNENKAI PRIZE ROULETTE</p>
      </header>

      <div class="settings-bar">
        <button class="settings-toggle-btn" id="settingsToggleBtn" type="button" aria-expanded="true" aria-controls="settingsPanel" aria-label="設定を隠す"><span aria-hidden="true">⚙️</span></button>
      </div>

      <div class="layout" id="mainLayout">
        <section class="stage" aria-label="ルーレット">
          <div class="wheel-zone" id="wheelZone">
            <svg class="wheel" id="wheelSvg" viewBox="0 0 400 400" role="img" aria-label="景品ルーレットの盤面"></svg>
            <div class="bulbs" id="bulbs" aria-hidden="true"></div>
            <div class="dart" id="dart" aria-hidden="true">
              <svg viewBox="0 0 120 190" style="width:100%;height:auto;display:block">
                <!-- flights -->
                <path d="M38 6 L60 44 L22 62 L14 22 Z" fill="#ff3b5c" stroke="#ffd7de" stroke-width="2"/>
                <path d="M82 6 L60 44 L98 62 L106 22 Z" fill="#ff7a93" stroke="#ffd7de" stroke-width="2"/>
                <path d="M60 2 L74 40 L60 58 L46 40 Z" fill="#e02444" stroke="#ffd7de" stroke-width="2"/>
                <!-- barrel -->
                <rect x="52" y="42" width="16" height="66" rx="7" fill="#2b2f3a" stroke="#cfd6e4" stroke-width="2"/>
                <rect x="52" y="58" width="16" height="7" fill="#ffc542"/>
                <rect x="52" y="76" width="16" height="7" fill="#ffc542"/>
                <!-- shaft to tip -->
                <path d="M56 108 L64 108 L61 150 L59 150 Z" fill="#9aa5b8"/>
                <path d="M59 150 L61 150 L60 186 Z" fill="#e8edf5"/>
              </svg>
            </div>
          </div>

          <button class="spin-btn" id="spinBtn" type="button">まわす！</button>
          <p class="spin-hint" id="spinHint" aria-live="polite">ボタンを押すとルーレットが回ります</p>
        </section>

        <aside>
          <section class="panel" id="settingsPanel" aria-label="景品の設定">
            <div class="panel-head">
              <h2>景品リスト</h2>
              <button class="hide-settings-btn" id="hideSettingsBtn" type="button">閉じる</button>
            </div>
            <p class="note">名前は景品名に書き換えられます。「大きさ」の数字を大きくすると、その項目が広く・当たりやすくなります。終わったら「閉じる」で隠せます。再び変えたいときは右上の ⚙️ で戻せます。</p>
            <div class="toolbar">
              <button class="tool-btn" id="soundBtn" type="button" aria-pressed="true">
                <svg id="soundIconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
                <svg id="soundIconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H2v6h4l5 4z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>
                <span id="soundLabel">音あり</span>
              </button>
              <button class="tool-btn" id="equalBtn" type="button">大きさを均等に戻す</button>
            </div>
            <div id="itemList"></div>
            <button class="add-btn" id="addBtn" type="button">＋ 項目を追加</button>
          </section>

          <section class="panel" aria-label="当選履歴">
            <h2>当選履歴</h2>
            <p class="history-empty" id="historyEmpty">まだ当選はありません。</p>
            <ol class="history-list" id="historyList"></ol>
          </section>
        </aside>
      </div>
    </div>

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="winnerName">
      <div class="winner-card">
        <p class="winner-label">当 選</p>
        <p class="winner-name" id="winnerName">A</p>
        <p class="winner-sub" id="winnerSub">おめでとうございます！</p>
        <div class="winner-btns">
          <button class="btn-exclude" id="excludeBtn" type="button">この景品を外して次へ</button>
          <button class="btn-keep" id="keepBtn" type="button">そのまま次へ</button>
        </div>
      </div>
    </div>

    <p class="sr-only" aria-live="assertive" id="liveRegion"></p>

    <script>
      (function () {
        "use strict";

        var PALETTE = ["#ff4757", "#ff8c1a", "#ffc312", "#2ed573", "#1abc9c", "#12cbc4", "#3d8bff", "#7158e8", "#e84393", "#ff6b81", "#a3cb38", "#f368e0"];
        var CX = 200, CY = 200, R = 186;

        var items = "ABCDEFGHIJ".split("").map(function (ch, i) {
          return { name: ch, weight: 3, active: true, color: PALETTE[i % PALETTE.length] };
        });
        var history = [];
        var rotation = 0;       // cumulative degrees, clockwise
        var spinning = false;
        var soundOn = true;
        var lastWinner = null;
        var dartAngle = 0;      // screen angle (deg, 0 = top, clockwise) where the dart will land this throw
        var dartFinalRot = 6;   // dart element rotation when stuck

        var wheelSvg = document.getElementById("wheelSvg");
        var wheelZone = document.getElementById("wheelZone");
        var bulbsEl = document.getElementById("bulbs");
        var dartEl = document.getElementById("dart");
        var spinBtn = document.getElementById("spinBtn");
        var spinHint = document.getElementById("spinHint");
        var itemList = document.getElementById("itemList");
        var historyList = document.getElementById("historyList");
        var historyEmpty = document.getElementById("historyEmpty");
        var overlay = document.getElementById("overlay");
        var winnerNameEl = document.getElementById("winnerName");
        var liveRegion = document.getElementById("liveRegion");
        var mainLayout = document.getElementById("mainLayout");
        var settingsPanel = document.getElementById("settingsPanel");
        var settingsToggleBtn = document.getElementById("settingsToggleBtn");
        var hideSettingsBtn = document.getElementById("hideSettingsBtn");
        var settingsVisible = true;

        function setSettingsVisible(visible) {
          settingsVisible = visible;
          settingsPanel.hidden = !visible;
          mainLayout.classList.toggle("settings-hidden", !visible);
          settingsToggleBtn.setAttribute("aria-expanded", visible ? "true" : "false");
          settingsToggleBtn.setAttribute("aria-label", visible ? "設定を隠す" : "設定を表示");
          if (!visible) settingsToggleBtn.focus({ preventScroll: true });
        }
        settingsToggleBtn.addEventListener("click", function () { setSettingsVisible(!settingsVisible); });
        hideSettingsBtn.addEventListener("click", function () { setSettingsVisible(false); });

        /* ---------------- audio (all synthesized, no files) ---------------- */
        var actx = null;
        function audio() {
          if (!actx) {
            var AC = window.AudioContext || window.webkitAudioContext;
            if (AC) actx = new AC();
          }
          if (actx && actx.state === "suspended") actx.resume();
          return actx;
        }
        function env(gainNode, t, peak, dur) {
          gainNode.gain.setValueAtTime(0.0001, t);
          gainNode.gain.exponentialRampToValueAtTime(peak, t + 0.008);
          gainNode.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        }
        function playTick() {
          if (!soundOn) return;
          var ac = audio(); if (!ac) return;
          var t = ac.currentTime;
          var o = ac.createOscillator(), g = ac.createGain();
          o.type = "square"; o.frequency.setValueAtTime(2100, t);
          env(g, t, 0.05, 0.045);
          o.connect(g); g.connect(ac.destination);
          o.start(t); o.stop(t + 0.06);
        }
        function playWhoosh() {
          if (!soundOn) return;
          var ac = audio(); if (!ac) return;
          var t = ac.currentTime, dur = 0.7;
          var buf = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate);
          var d = buf.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          var src = ac.createBufferSource(); src.buffer = buf;
          var f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.2;
          f.frequency.setValueAtTime(300, t);
          f.frequency.exponentialRampToValueAtTime(2600, t + dur * 0.7);
          f.frequency.exponentialRampToValueAtTime(500, t + dur);
          var g = ac.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.16, t + 0.12);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(f); f.connect(g); g.connect(ac.destination);
          src.start(t);
        }
        function playThud() {
          if (!soundOn) return;
          var ac = audio(); if (!ac) return;
          var t = ac.currentTime;
          var o = ac.createOscillator(), g = ac.createGain();
          o.type = "sine";
          o.frequency.setValueAtTime(150, t);
          o.frequency.exponentialRampToValueAtTime(38, t + 0.22);
          env(g, t, 0.55, 0.3);
          o.connect(g); g.connect(ac.destination);
          o.start(t); o.stop(t + 0.32);
          // woody knock
          var buf = ac.createBuffer(1, ac.sampleRate * 0.08, ac.sampleRate);
          var d = buf.getChannelData(0);
          for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
          var src = ac.createBufferSource(); src.buffer = buf;
          var f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900;
          var g2 = ac.createGain(); g2.gain.value = 0.5;
          src.connect(f); f.connect(g2); g2.connect(ac.destination);
          src.start(t);
        }
        function playNote(freq, start, dur, type, vol) {
          var ac = audio(); if (!ac) return;
          var t = ac.currentTime + start;
          var o = ac.createOscillator(), g = ac.createGain();
          o.type = type || "triangle"; o.frequency.value = freq;
          env(g, t, vol || 0.22, dur);
          o.connect(g); g.connect(ac.destination);
          o.start(t); o.stop(t + dur + 0.05);
        }
        function playFanfare() {
          if (!soundOn) return;
          if (!audio()) return;
          var seq = [523.25, 659.25, 783.99, 1046.5];
          seq.forEach(function (f, i) { playNote(f, i * 0.13, 0.34, "triangle", 0.24); playNote(f / 2, i * 0.13, 0.34, "sine", 0.12); });
          [523.25, 659.25, 783.99, 1046.5].forEach(function (f) { playNote(f, 0.56, 0.85, "triangle", 0.2); });
          playNote(1318.5, 0.56, 0.85, "sine", 0.1);
        }

        /* ---------------- wheel geometry ---------------- */
        function polar(angleDeg, r) {
          var a = (angleDeg - 90) * Math.PI / 180;
          return [CX + r * Math.cos(a), CY + r * Math.sin(a)];
        }
        function activeItems() { return items.filter(function (it) { return it.active; }); }
        function segments() {
          var act = activeItems();
          var total = act.reduce(function (s, it) { return s + it.weight; }, 0);
          var segs = [], start = 0;
          act.forEach(function (it) {
            var span = total > 0 ? it.weight / total * 360 : 0;
            segs.push({ item: it, start: start, end: start + span, mid: start + span / 2, span: span });
            start += span;
          });
          return segs;
        }
        function segPath(s) {
          var p1 = polar(s.start, R), p2 = polar(s.end, R);
          var large = s.span > 180 ? 1 : 0;
          return "M " + CX + " " + CY + " L " + p1[0].toFixed(2) + " " + p1[1].toFixed(2) +
                 " A " + R + " " + R + " 0 " + large + " 1 " + p2[0].toFixed(2) + " " + p2[1].toFixed(2) + " Z";
        }

        var wheelGroup = null;
        function buildWheel() {
          var segs = segments();
          var html = "";
          // outer rim
          html += '<circle cx="200" cy="200" r="196" fill="#17102a" stroke="#ffc542" stroke-width="5"/>';
          html += '<circle cx="200" cy="200" r="188" fill="none" stroke="#7a5200" stroke-width="3"/>';
          html += '<g id="wheelRotor">';
          segs.forEach(function (s) {
            html += '<path d="' + segPath(s) + '" fill="' + s.item.color + '" stroke="#14101f" stroke-width="2.5"/>';
            // inner shine arc
            var ip1 = polar(s.start + s.span * 0.12, R * 0.9), ip2 = polar(s.end - s.span * 0.12, R * 0.9);
            html += '<path d="M ' + ip1[0].toFixed(1) + " " + ip1[1].toFixed(1) + " A " + (R * 0.9) + " " + (R * 0.9) + " 0 0 1 " + ip2[0].toFixed(1) + " " + ip2[1].toFixed(1) + '" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="7" stroke-linecap="round"/>';
          });
          segs.forEach(function (s) {
            var name = s.item.name || " ";
            var fs = name.length <= 2 ? 34 : name.length <= 4 ? 24 : name.length <= 7 ? 18 : 14;
            var labelR = R * 0.66;
            html += '<g transform="rotate(' + s.mid.toFixed(2) + ' 200 200)">' +
                    '<text x="200" y="' + (200 - labelR + fs * 0.36).toFixed(1) + '" text-anchor="middle" font-size="' + fs + '" font-weight="800" fill="#ffffff" stroke="rgba(0,0,0,0.45)" stroke-width="4" paint-order="stroke" style="font-family:inherit">' +
                    escapeHtml(name) + "</text></g>";
          });
          html += "</g>";
          // hub
          html += '<circle cx="200" cy="200" r="47" fill="#1d1433" stroke="#ffc542" stroke-width="4"/>';
          html += '<g transform="translate(176,176) scale(2)"><path d="M20 12v10H4V12zM2 7h20v5H2zM12 22V7M12 7s-4.5.2-6-1.2C4.6 4.5 5.4 2 7.3 2 9.6 2 12 7 12 7zm0 0s4.5.2 6-1.2C19.4 4.5 18.6 2 16.7 2 14.4 2 12 7 12 7z" fill="none" stroke="#ffc542" stroke-width="1.6" stroke-linejoin="round"/></g>';
          // no fixed pointer: the dart itself marks the winning segment,
          // and it lands at a different place on the wheel every throw
          wheelSvg.innerHTML = html;
          wheelGroup = wheelSvg.querySelector("#wheelRotor");
          applyRotation();
          buildBulbs(segs.length);
        }
        function applyRotation() {
          if (wheelGroup) wheelGroup.setAttribute("transform", "rotate(" + rotation.toFixed(3) + " 200 200)");
        }
        function buildBulbs(n) {
          var count = 24, html = "";
          bulbsEl.innerHTML = "";
          for (var i = 0; i < count; i++) {
            var a = i / count * 360;
            var rad = (a - 90) * Math.PI / 180;
            var x = 50 + 49 * Math.cos(rad), y = 50 + 49 * Math.sin(rad);
            var b = document.createElement("span");
            b.className = "bulb" + (i % 2 ? " alt" : "");
            b.style.left = x + "%"; b.style.top = y + "%";
            bulbsEl.appendChild(b);
          }
        }
        function escapeHtml(s) {
          return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        /* ---------------- settings UI ---------------- */
        function totalWeight() { return items.reduce(function (s, it) { return s + (it.active ? it.weight : 0); }, 0); }
        function renderSettings() {
          var total = totalWeight();
          itemList.innerHTML = "";
          items.forEach(function (it, idx) {
            var row = document.createElement("div");
            row.className = "item-row" + (it.active ? "" : " off");

            var dot = document.createElement("span");
            dot.className = "dot"; dot.style.background = it.color;

            var name = document.createElement("input");
            name.className = "item-name"; name.type = "text"; name.value = it.name;
            name.maxLength = 12; name.setAttribute("aria-label", "景品名");
            name.disabled = spinning;
            name.addEventListener("input", function () {
              it.name = name.value;
              if (!spinning) buildWheel();
            });

            var wctl = document.createElement("div");
            wctl.className = "weight-ctl";
            var minus = document.createElement("button");
            minus.className = "w-btn"; minus.type = "button"; minus.textContent = "−";
            minus.setAttribute("aria-label", "大きさを小さく");
            minus.disabled = spinning || it.weight <= 1;
            minus.addEventListener("click", function () { it.weight = Math.max(1, it.weight - 1); refresh(); });
            var val = document.createElement("div");
            val.className = "w-val";
            var pct = it.active && total > 0 ? Math.round(it.weight / total * 100) : 0;
            val.innerHTML = '<span class="w-num">' + it.weight + '</span><span class="w-pct">' + (it.active ? "約" + pct + "%" : "除外中") + "</span>";
            var plus = document.createElement("button");
            plus.className = "w-btn"; plus.type = "button"; plus.textContent = "＋";
            plus.setAttribute("aria-label", "大きさを大きく");
            plus.disabled = spinning || it.weight >= 30;
            plus.addEventListener("click", function () { it.weight = Math.min(30, it.weight + 1); refresh(); });
            wctl.appendChild(minus); wctl.appendChild(val); wctl.appendChild(plus);

            var actions = document.createElement("div");
            actions.className = "row-actions";
            var toggle = document.createElement("button");
            toggle.type = "button";
            toggle.className = "mini-btn " + (it.active ? "exclude" : "restore");
            toggle.textContent = it.active ? "除外" : "戻す";
            toggle.disabled = spinning;
            toggle.addEventListener("click", function () {
              if (it.active && activeItems().length <= 2) { spinHint.textContent = "回すには2つ以上の項目が必要です。"; return; }
              it.active = !it.active; refresh();
            });
            actions.appendChild(toggle);
            if (items.length > 2) {
              var del = document.createElement("button");
              del.type = "button"; del.className = "mini-btn del"; del.textContent = "削除";
              del.disabled = spinning;
              del.addEventListener("click", function () {
                if (it.active && activeItems().length <= 2) { spinHint.textContent = "回すには2つ以上の項目が必要です。"; return; }
                items.splice(idx, 1); refresh();
              });
              actions.appendChild(del);
            }

            row.appendChild(dot); row.appendChild(name); row.appendChild(wctl); row.appendChild(actions);
            itemList.appendChild(row);
          });
          document.getElementById("addBtn").disabled = spinning;
          document.getElementById("equalBtn").disabled = spinning;
        }
        function refresh() { buildWheel(); renderSettings(); }

        document.getElementById("addBtn").addEventListener("click", function () {
          var used = {};
          items.forEach(function (it) { used[it.name] = true; });
          var label = null;
          for (var c = 65; c <= 90; c++) { var ch = String.fromCharCode(c); if (!used[ch]) { label = ch; break; } }
          if (!label) label = "景品" + (items.length + 1);
          items.push({ name: label, weight: 3, active: true, color: PALETTE[items.length % PALETTE.length] });
          refresh();
        });
        document.getElementById("equalBtn").addEventListener("click", function () {
          items.forEach(function (it) { it.weight = 3; });
          refresh();
        });

        var soundBtn = document.getElementById("soundBtn");
        soundBtn.addEventListener("click", function () {
          soundOn = !soundOn;
          soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
          document.getElementById("soundLabel").textContent = soundOn ? "音あり" : "音なし";
          document.getElementById("soundIconOn").style.display = soundOn ? "" : "none";
          document.getElementById("soundIconOff").style.display = soundOn ? "none" : "";
          if (soundOn) { audio(); playTick(); }
        });

        /* ---------------- confetti ---------------- */
        var confCanvas = document.getElementById("confetti");
        var confCtx = confCanvas.getContext("2d");
        var confetti = [], confRunning = false;
        function sizeConfetti() { confCanvas.width = window.innerWidth; confCanvas.height = window.innerHeight; }
        window.addEventListener("resize", sizeConfetti);
        sizeConfetti();
        function launchConfetti() {
          var colors = PALETTE.concat(["#ffc542", "#ffffff"]);
          var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var n = reduced ? 40 : 170;
          for (var i = 0; i < n; i++) {
            confetti.push({
              x: window.innerWidth / 2 + (Math.random() - 0.5) * window.innerWidth * 0.5,
              y: window.innerHeight * 0.32,
              vx: (Math.random() - 0.5) * 13,
              vy: -(Math.random() * 11 + 5),
              w: Math.random() * 9 + 5, h: Math.random() * 6 + 4,
              rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
              color: colors[i % colors.length], life: 1
            });
          }
          if (!confRunning) { confRunning = true; requestAnimationFrame(confStep); }
        }
        function confStep() {
          confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
          confetti = confetti.filter(function (p) { return p.life > 0 && p.y < confCanvas.height + 30; });
          confetti.forEach(function (p) {
            p.vy += 0.22; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
            if (p.y > confCanvas.height * 0.75) p.life -= 0.02;
            confCtx.save();
            confCtx.translate(p.x, p.y); confCtx.rotate(p.rot);
            confCtx.globalAlpha = Math.max(0, Math.min(1, p.life));
            confCtx.fillStyle = p.color;
            confCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.4 + Math.abs(Math.sin(p.rot * 2)) * 0.6));
            confCtx.restore();
          });
          if (confetti.length) requestAnimationFrame(confStep);
          else { confRunning = false; confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height); }
        }

        /* ---------------- spin ---------------- */
        // wheel-local angle currently sitting under the dart's landing spot
        function pointerAngle() { return ((dartAngle - rotation) % 360 + 360) % 360; }

        // Choose a fresh landing spot for this throw — a random direction around
        // the wheel and a random distance from the centre — and park the dart
        // just outside it, ready to fly in along that direction.
        function placeDart() {
          dartAngle = Math.random() * 360;
          var tilt = Math.random() * 16 - 8;                  // slight natural lean
          dartFinalRot = dartAngle + tilt;
          var size = wheelZone.clientWidth || 400;
          // Size the dart from the wheel size, then clamp the landing distance
          // so the WHOLE dart (tip + body + flights) stays inside the rim:
          // the farthest corner of the stuck dart must not cross the inner
          // rim (r = 188 of the 400-unit viewBox), with a safety margin for
          // the lean / wobble. Without this the flights poked outside the
          // frame whenever the dart landed in the outer half of the wheel.
          var dartW = Math.max(44, Math.round(size * 0.145));
          var dartH = Math.round(dartW * 190 / 120);
          dartEl.style.width = dartW + "px";
          dartEl.style.marginLeft = (-dartW / 2) + "px";
          dartEl.style.marginTop = (-dartH) + "px";
          var rimIn = size * 188 / 400 - 10;
          var maxDist = Math.sqrt(Math.max(0, rimIn * rimIn - (dartW / 2) * (dartW / 2))) - dartH;
          var minDist = size * 56 / 400;                      // keep the tip just clear of the hub (r = 47)
          var radiusFrac = 0.30 + Math.random() * 0.20;       // 30%–50% of the segment radius
          var dist = radiusFrac * (size * R / 400);
          dist = Math.max(minDist, Math.min(dist, Math.max(minDist, maxDist)));
          var rad = dartAngle * Math.PI / 180;
          var tipX = size / 2 + dist * Math.sin(rad);
          var tipY = size / 2 - dist * Math.cos(rad);
          dartEl.style.left = tipX.toFixed(1) + "px";
          dartEl.style.top = tipY.toFixed(1) + "px";
          dartEl.style.setProperty("--dart-rot", dartFinalRot.toFixed(1) + "deg");
          // start position: further out along the same radial line, angled in
          var outX = Math.sin(rad) * 210, outY = -Math.cos(rad) * 210;
          dartEl.style.transition = "none";
          dartEl.style.transform = "translate(" + outX.toFixed(1) + "px, " + outY.toFixed(1) + "px) rotate(" + (dartFinalRot + 48).toFixed(1) + "deg)";
          void dartEl.offsetWidth;
          dartEl.style.transition = ""; // hand control back to the .fly transition for the throw
        }
        function segIndexAt(angle, segs) {
          for (var i = 0; i < segs.length; i++) if (angle >= segs[i].start && angle < segs[i].end) return i;
          return segs.length - 1;
        }
        function pickWinner(segs) {
          var total = segs.reduce(function (s, x) { return s + x.item.weight; }, 0);
          var r = Math.random() * total;
          for (var i = 0; i < segs.length; i++) { r -= segs[i].item.weight; if (r <= 0) return i; }
          return segs.length - 1;
        }

        function spin() {
          var segs = segments();
          if (spinning || segs.length < 2) return;
          audio(); // unlock on user gesture
          spinning = true;
          lastWinner = null;
          overlay.classList.remove("show");
          dartEl.classList.remove("fly", "stuck");
          dartEl.style.opacity = "0";
          placeDart();
          spinBtn.disabled = true;
          spinBtn.textContent = "回転中…";
          spinHint.textContent = "ダーツが刺さるまでお待ちください…";
          renderSettings();
          playWhoosh();

          var winIdx = pickWinner(segs);
          var winSeg = segs[winIdx];
          // aim inside the middle 56% of the winning segment so the dart never lands on a border
          var margin = winSeg.span * 0.22;
          var targetPoint = winSeg.start + margin + Math.random() * (winSeg.span - margin * 2);
          // the wheel must turn until the winning point sits exactly where the dart lands
          var currentMod = ((rotation % 360) + 360) % 360;
          var neededMod = ((dartAngle - targetPoint) % 360 + 360) % 360;
          var delta = ((neededMod - currentMod) % 360 + 360) % 360;
          var totalDelta = 360 * 5 + delta;         // 5 full turns + alignment
          var startRot = rotation;
          var duration = 6200;
          var startTime = null;
          var lastSegIdx = segIndexAt(pointerAngle(), segs);
          var dartHit = false;

          function frame(now) {
            if (!startTime) startTime = now;
            var t = Math.min(1, (now - startTime) / duration);
            var eased = 1 - Math.pow(1 - t, 3);      // easeOutCubic: fast start, long gentle stop
            rotation = startRot + totalDelta * eased;
            applyRotation();

            var idx = segIndexAt(pointerAngle(), segs);
            if (idx !== lastSegIdx) { lastSegIdx = idx; playTick(); }

            if (!dartHit && t >= 0.68) {
              dartHit = true;
              dartEl.style.opacity = "1";
              dartEl.classList.add("fly");
              void dartEl.offsetWidth; // let the fly transition pick up the transform change
              dartEl.style.transform = "translate(0px, 0px) rotate(" + dartFinalRot.toFixed(1) + "deg)";
              playThud();
              wheelZone.classList.remove("shake");
              void wheelZone.offsetWidth;
              wheelZone.classList.add("shake");
              spinHint.textContent = "ダーツが刺さった！ 結果は…";
              setTimeout(function () { dartEl.classList.add("stuck"); }, 170);
            }

            if (t < 1) requestAnimationFrame(frame);
            else finishSpin(segs[winIdx]);
          }
          requestAnimationFrame(frame);
        }

        function finishSpin(winSeg) {
          spinning = false;
          rotation = ((rotation % 360) + 360) % 360 + 360 * Math.floor(rotation / 360);
          applyRotation();
          lastWinner = winSeg.item;
          history.unshift(winSeg.item.name);
          renderHistory();
          spinBtn.disabled = false;
          spinBtn.textContent = "もう一度まわす！";
          spinHint.textContent = "当選は「" + winSeg.item.name + "」です";
          winnerNameEl.textContent = winSeg.item.name;
          document.getElementById("winnerSub").textContent = (history.length) + "回目の当選です。おめでとうございます！";
          liveRegion.textContent = "当選は " + winSeg.item.name + " です";
          renderSettings();
          playFanfare();
          launchConfetti();
          setTimeout(function () { overlay.classList.add("show"); }, 550);
        }

        function renderHistory() {
          historyList.innerHTML = "";
          historyEmpty.style.display = history.length ? "none" : "";
          history.forEach(function (name, i) {
            var li = document.createElement("li");
            var round = document.createElement("span");
            round.className = "round"; round.textContent = (history.length - i) + "回目";
            var dot = document.createElement("span");
            dot.className = "dot";
            var found = items.filter(function (it) { return it.name === name; })[0];
            dot.style.background = found ? found.color : "#888";
            var nm = document.createElement("span");
            nm.className = "hname"; nm.textContent = name;
            li.appendChild(round); li.appendChild(dot); li.appendChild(nm);
            historyList.appendChild(li);
          });
        }

        spinBtn.addEventListener("click", spin);
        document.getElementById("keepBtn").addEventListener("click", function () { overlay.classList.remove("show"); });
        document.getElementById("excludeBtn").addEventListener("click", function () {
          if (lastWinner) {
            if (activeItems().length > 2) { lastWinner.active = false; refresh(); }
            else spinHint.textContent = "項目が2つしかないため、除外できませんでした。";
          }
          overlay.classList.remove("show");
        });

        buildWheel();
        renderSettings();
      })();
    </script>
  </body>
</html>
